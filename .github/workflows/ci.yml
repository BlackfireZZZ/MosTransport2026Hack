name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv==0.12.13
      - run: uv sync --package tramflow-backend --extra dev --locked
      - run: uv run --package tramflow-backend ruff check backend
      - run: uv run --package tramflow-backend mypy backend/app
      - run: uv run --package tramflow-backend pytest backend/tests

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv==0.12.13
      - run: uv sync --package tramflow-ml --extra dev --locked
      - run: uv run --package tramflow-ml ruff check ml
      - run: uv run --package tramflow-ml mypy ml/src
      - run: uv run --package tramflow-ml pytest ml/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --wait
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
