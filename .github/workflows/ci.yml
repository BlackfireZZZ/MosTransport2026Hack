name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install uv==0.12.13
      - run: make sync-backend
      - run: make backend-check architecture-check

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install uv==0.12.13
      - run: make sync-ml
      - run: make ml-check ml-eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install uv==0.12.13
      - run: make sync-backend
      - run: make frontend-install
      - run: make frontend-check contract-check
      - run: make e2e-install
      - run: make e2e

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make compose-check
      - run: make migration-verify
      - run: make stack-verify
      - if: failure()
        run: docker compose ls && docker ps --all
